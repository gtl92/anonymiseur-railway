# nginx.conf — reverse proxy pour l'Anonymiseur judiciaire.
#
# Installation :
#   cp deploy/nginx.conf /etc/nginx/sites-available/anonymiseur.jobiizy.com
#   ln -s /etc/nginx/sites-available/anonymiseur.jobiizy.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d anonymiseur.jobiizy.com
#
# certbot réécrit automatiquement ce fichier pour ajouter les directives
# ssl_certificate / ssl_certificate_key et le bloc de redirection HTTPS.
# Après le passage de certbot, vérifier qu'AUCUN bloc "listen 80" ne sert
# plus de contenu en clair (uniquement une redirection 301 vers https) —
# c'est le comportement par défaut de `certbot --nginx`.

upstream anonymiseur_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name anonymiseur.jobiizy.com;

    # Redirection stricte vers HTTPS — pas de fallback HTTP après le switch DNS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anonymiseur.jobiizy.com;

    # ssl_certificate / ssl_certificate_key : injectés par certbot --nginx.

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Upload de documents jusqu'à 100 Mo (aligné sur la limite multer de server.js)
    client_max_body_size 100m;

    # L'OCR (pdftoppm + tesseract.js) peut prendre plusieurs dizaines de
    # secondes sur des PDF scannés multi-pages : timeouts généreux.
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Les logs nginx (access/error) ne contiennent que méthode + chemin
    # d'URL (ex: POST /api/extract) — jamais le nom de fichier original ni
    # le contenu, qui voyagent dans le corps multipart et ne sont pas
    # journalisés par nginx. Ne pas activer de logging de corps de requête.

    location / {
        proxy_pass http://anonymiseur_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
